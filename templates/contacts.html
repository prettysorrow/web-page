{% extends "base.html" %}

{% block title %}contacts{% endblock %}

{% block content %}
<style>
    .contacts-links .list-group-item a {
        color: white;
        text-decoration-color: white;
    }

    .contacts-links .list-group-item a:hover {
        color: gray;
        text-decoration-color: gray;
    }
</style>
<h2>Контактные данные</h2>
<p class="lead text-white-50">Свяжитесь со мной удобным способом</p>
<div class="row justify-content-center">
    <div class="col-md-15 text-center contacts-links">
        <ul class="list-group list-group-flush">
            <li class="list-group-item bg-transparent text-white border-0">
                <strong>Telegram:</strong>
                <a href="https://t.me/prettysorrow">@prettysorrow</a>
            </li>
            <li class="list-group-item bg-transparent text-white border-0">
                <strong>GitHub:</strong>
                <a href="https://github.com/prettysorrow">@prettysorrow</a>
            </li>
        </ul>
        <div class="mt-4 text-center">
            <a href="{{ url_for('index') }}" class="btn btn-lg btn-outline-light fw-bold">На главную</a>
        </div>
    </div>
</div>
{% endblock %}
